services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: marica/run_walk_tracking_server_dev
    container_name: run_walk_tracking_server_dev
    restart: always
    ports:
      - 80:80
    volumes:
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./composer.json:/var/www/html/composer.json
      - ./vendor:/var/www/html/vendor
    env_file:
      - ./config/database.env
    environment:
      - MYSQL_HOST=db
    depends_on:
      - db

  db:
    image: mysql:lts
    container_name: run_walk_tracking_server_db_dev
    restart: always
    ports:
      - 3306:3306
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql
    env_file:
      - ./config/database.env

  db-adminer:
    image: phpmyadmin
    container_name: run_walk_tracking_server_db-adminer_dev
    restart: always
    ports:
      - 8080:80
    env_file:
      - ./config/database.env
    environment:
      - PMA_HOST=db
    depends_on:
      - db

volumes:
  db-data:
    name: run_walk_tracking_server_db-data_dev
