apply plugin: 'com.android.application'

def props = new Properties()

file("${rootDir}/local.properties").withInputStream { props.load(it) }

def SERVER_URL = props.getProperty("SERVER_URL") ?: "http://10.0.2.2:80/"

def MAPS_API_KEY = props.getProperty("MAPS_API_KEY") ?: "AIza..."

android {
    compileSdk 36
    defaultConfig {
        applicationId "com.run_walk_tracking_gps"
        minSdkVersion 26
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            buildConfigField "String", "SERVER_URL",  "\"${SERVER_URL}\""
            resValue "string", "google_maps_key", MAPS_API_KEY
        }
        release {
            buildConfigField "String", "SERVER_URL",  "\"${SERVER_URL}\""
            resValue "string", "google_maps_key", MAPS_API_KEY
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    testOptions{
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
    namespace 'com.run_walk_tracking_gps'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'android.arch.lifecycle:extensions:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support:support-annotations:28.0.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'com.android.support:design:28.0.0'
    // HTTP library
    implementation 'com.android.volley:volley:1.2.1'

    // material design
    implementation 'com.google.android.material:material:1.12.0'
    // google maps
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.maps.android:android-maps-utils:3.14.0'
    
    // image picker
    implementation 'com.github.dhaval2404:imagepicker:2.1'
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.8"

    // graphview
    implementation 'com.jjoe64:graphview:4.2.2'
    // seekbar
    implementation 'co.infinum:IndicatorSeekBar:2.1.2'
    // dragsortlistview
    implementation project(path: ':libs:drag-sort-listview')
    //glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Glide v4 uses this new annotation processor -- see https://bumptech.github.io/glide/doc/generatedapi.html
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

}
