apply plugin: 'com.android.library'

android {
    compileSdkVersion 7

    defaultConfig {
        minSdkVersion 7
        targetSdkVersion 7
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    namespace 'com.mobeta.android.dslv'
}

dependencies {
    implementation 'com.android.support:support-v4:18.+'
}
